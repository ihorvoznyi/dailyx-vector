  h(V.SkillNode, { node: { title: 'Post every week', icon: 'video', maxLevel: 4, level: 3 }, state: 'active', style: P(492, 0) }),
  h(V.SkillNode, { node: { title: '$5K month', icon: 'money', progress: 1 }, state: 'mastered', style: P(656, 0) }),
  h(V.SkillNode, { node: { goal: true }, state: 'goal', style: P(820, 0) })));
